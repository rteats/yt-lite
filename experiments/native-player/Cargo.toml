[package]
name = "yt-lite-native-player-proof"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
slint = { version = "=1.17.1", default-features = false, features = ["compat-1-2", "std", "backend-winit", "renderer-femtovg"] }
libloading = "0.8"
yt-lite-extraction-proof = { path = "../.." }
tokio = { version = "1", features = ["rt", "time"] }

[profile.release]
lto = "thin"
